name: public-metadata

# Validate current entries, licenses, digests, official Asset/Cluster toolchain
# paths, and GitHub Release consistency. No private repository is cloned.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index/**'
      - 'references/**'
      - 'clusters/**'
      - 'schemas/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-POLICY.md'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'index/**'
      - 'references/**'
      - 'clusters/**'
      - 'schemas/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-POLICY.md'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/public-metadata.yml'
      - '.github/pull_request_template.md'

jobs:
  public-metadata:
    name: Public metadata truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --omit=optional keeps the installed graph equal to the audited
      # toolchain: the vendored lock resolves every non-optional package to
      # file:vendor/*.tgz, and src/toolchain.mjs rejects any package set other
      # than the one recorded in toolchain-files.json. A package the lock marks
      # `optional: true` is the one exemption, because which native platform
      # package an installer materialises is a property of the runner: it may
      # appear or be absent, and its own members are not compared. The scope
      # directory around it is still walked, every required package stays
      # byte-exact, and an undeclared directory is rejected wherever it appears.
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Run fixture suite
        run: npm test

      # The receipt generator is never trusted about its own verdict: this step
      # re-derives every leg's unavailability codes from the committed bytes and
      # requires the receipt and the registration to agree with them.
      - name: Verify the CI leg receipts against the committed bytes
        env:
          KDNA_ASSETS_METADATA_INDEX: index/current.json
        run: node scripts/verify-ci-leg-receipts.mjs

      - name: Run the committed current-surface validators
        run: |
          npm run validate:indexes
          npm run audit
          node scripts/verify-digests.mjs
          node scripts/check-clusters.mjs
          node scripts/check-licenses.mjs
          node scripts/check-public-surface.mjs

      - name: Check the indexed reference assets through the packed CLI
        env:
          KDNA_ASSETS_METADATA_INDEX: index/current.json
        run: node scripts/ci-leg-receipt.mjs current-assets

      - name: Audit the retired 1.0.0 index metadata
        env:
          KDNA_ASSETS_METADATA_INDEX: index/current.json
          KDNA_CI_ONLINE: '1'
        run: node scripts/ci-leg-receipt.mjs index-metadata
