name: release-verification

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Assert HEAD matches release tag
        run: |
          TAG_REF=$(git rev-parse "refs/tags/${{ github.event.release.tag_name }}" 2>/dev/null || echo '')
          HEAD_REF=$(git rev-parse HEAD)
          test "$TAG_REF" = "$HEAD_REF" || {
            echo "HEAD ($HEAD_REF) does not match tag ${{ github.event.release.tag_name }} ($TAG_REF)"
            exit 1
          }
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Run fixture suite
        run: npm test
      - name: Run local audit
        run: npm run audit
      # The receipt generator is never trusted about its own verdict: this step
      # re-derives every leg's unavailability codes from the committed bytes and
      # requires the receipt and the registration to agree with them.
      - name: Verify the CI leg receipts against the committed bytes
        env:
          KDNA_ASSETS_METADATA_INDEX: index/current.json
        run: node scripts/verify-ci-leg-receipts.mjs
      - name: Run online release consistency
        env:
          KDNA_ASSETS_METADATA_INDEX: index/current.json
          KDNA_CI_ONLINE: '1'
        run: node scripts/ci-leg-receipt.mjs online-release-consistency
